name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: ./test.sh

      - name: Build the app bundle
        run: ./build.sh

      - name: Confirm the binary is universal
        run: |
          archs=$(lipo -archs StickiesNative)
          echo "archs: $archs"
          echo "$archs" | grep -q arm64
          echo "$archs" | grep -q x86_64
